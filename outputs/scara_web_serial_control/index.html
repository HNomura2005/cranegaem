<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PAKIRAロボ コントローラー</title>
  <style>
    :root {
      color-scheme: light;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #17202a;
    }

    main {
      width: min(1120px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 20px 0 34px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 19px;
    }

    .status {
      min-width: 180px;
      padding: 10px 12px;
      border: 1px solid #cbd5df;
      border-radius: 8px;
      background: #ffffff;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    .toolbar,
    .panel {
      border: 1px solid #cbd5df;
      border-radius: 8px;
      background: #ffffff;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 12px;
      margin-bottom: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(300px, 390px);
      gap: 14px;
      align-items: start;
    }

    .panel {
      padding: 16px;
      margin-bottom: 14px;
    }

    button {
      min-height: 46px;
      border: 1px solid #a9b7c6;
      border-radius: 8px;
      background: #eef3f7;
      color: #17202a;
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
      padding: 0 16px;
      
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none; 
    }

    button:hover:not(:disabled) {
      background: #e1ebf3;
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.primary {
      border-color: #2364aa;
      background: #2364aa;
      color: #ffffff;
    }

    button.danger {
      border-color: #b42318;
      background: #b42318;
      color: #ffffff;
    }

    button.warn {
      border-color: #bb7a00;
      background: #fff2cc;
    }
    
    button.info {
      border-color: #4da8da;
      background: #e6f7ff;
      color: #005a8c;
    }
    
    button.small {
      min-height: 36px;
      font-size: 14px;
      padding: 0 8px;
    }

    .manual { display: grid; gap: 10px; }
    .axis {
      display: grid;
      grid-template-columns: 86px 1fr 1fr;
      gap: 8px;
      align-items: center;
    }
    label { font-weight: 750; }
    input[type="number"], input[type="text"] {
      width: 96px;
      min-height: 40px;
      box-sizing: border-box;
      border: 1px solid #a9b7c6;
      border-radius: 8px;
      padding: 0 10px;
      font-size: 16px;
    }
    .field { display: flex; align-items: center; gap: 8px; }
    .magnet {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    details { margin-top: 8px; }
    summary { cursor: pointer; font-weight: 800; }
    pre {
      height: 150px;
      margin: 0;
      overflow: auto;
      padding: 12px;
      border-radius: 8px;
      background: #101820;
      color: #d7f2ff;
      font-size: 13px;
      white-space: pre-wrap;
    }

    .key-guide {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }
    .guide-item {
      display: flex;
      align-items: center;
      font-size: 15px;
      font-weight: bold;
      color: #2d3748;
    }
    .key-badge {
      display: inline-block;
      min-width: 20px;
      padding: 4px 8px;
      margin-right: 4px;
      background: #f8fafc;
      border: 1px solid #cbd5df;
      border-radius: 6px;
      font-family: ui-monospace, monospace;
      text-align: center;
      box-shadow: 0 3px 0 #cbd5df;
    }
    .guide-desc {
      margin-left: 8px;
      color: #4a5568;
    }

    .radar-container {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #101820;
      border-radius: 8px;
      padding: 10px;
    }

    @media (max-width: 820px) {
      header, .layout { grid-template-columns: 1fr; }
      .axis { grid-template-columns: 76px 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>PAKIRAロボ コントローラー</h1>
      <div class="status" id="status">アンタッチブル</div>
    </header>

    <section class="toolbar">
      <button class="primary" id="connect">Arduinoに接続</button>
      <button class="danger" id="stop">全停止</button>
      <button class="warn" id="home">初期位置へ戻る</button>
      <button class="info" id="zero">ここを原点にする</button>
    </section>

    <section class="layout">
      <div>
        <div class="panel">
          <h2>クレーン手動操作</h2>
          <div class="manual">
            <div style="display: flex; gap: 20px; margin-bottom: 8px;">
              <div class="field">
                <label for="speed">アーム速度</label>
                <input id="speed" type="number" value="450" min="50" max="1500" step="50">
              </div>
              <div class="field">
                <label for="speedZ">Z軸昇降速度</label>
                <input id="speedZ" type="number" value="1500" min="50" max="3000" step="50">
              </div>
            </div>

            <div class="axis">
              <label>肩</label>
              <button data-axis="J1" data-dir="-1">左回転</button>
              <button data-axis="J1" data-dir="1">右回転</button>
            </div>
            <div class="axis">
              <label>肘</label>
              <button data-axis="J2" data-dir="-1">縮む</button>
              <button data-axis="J2" data-dir="1">伸びる</button>
            </div>
            <div class="axis">
              <label>高さ</label>
              <button data-axis="Z" data-dir="-1">上がる</button>
              <button data-axis="Z" data-dir="1">下がる</button>
            </div>
          </div>
        </div>

        <div class="panel">
          <h2>アーム（サーボ）設定</h2>
          <div class="magnet">
            <button class="primary" id="closeArm">掴む (0度)</button>
            <button id="openArm">離す (70度)</button> 
          </div>
          <!-- 【追加】微調整用UI -->
          <div style="margin-top: 12px; margin-bottom: 8px; display: flex; gap: 8px;">
            <button class="small" id="servoMinus" style="flex: 1;">-5度</button>
            <button class="small" id="servoPlus" style="flex: 1;">+5度</button>
          </div>
          <button class="info" id="servoZero" style="width: 100%; font-size: 14px;">今の角度をアームの「0度」にする</button>
        </div>
        
        <div class="panel">
          <h2>キーボード操作</h2>
          <div class="key-guide">
            <div class="guide-item">
              <div>
                <span class="key-badge">W</span><span class="key-badge">A</span><span class="key-badge">S</span><span class="key-badge">D</span>
              </div>
              <span class="guide-desc">平面移動</span>
            </div>
            <div class="guide-item">
              <div>
                <span class="key-badge">Q</span><span class="key-badge">E</span>
              </div>
              <span class="guide-desc">上下移動</span>
            </div>
            <div class="guide-item">
              <div>
                <span class="key-badge">Space</span>
              </div>
              <span class="guide-desc">掴む</span>
            </div>
            <div class="guide-item">
              <div>
                <span class="key-badge">Shift</span>
              </div>
              <span class="guide-desc">離す</span>
            </div>
          </div>
        </div>
      </div>

      <div>
        <div class="panel">
          <h2>レーダー</h2>
          <div class="radar-container">
            <canvas id="radarCanvas" width="300" height="300"></canvas>
          </div>
        </div>

        <div class="panel">
          <h2>通信ログ</h2>
          <pre id="log"></pre>
          <details>
            <summary>詳細コマンド</summary>
            <div class="toolbar" style="margin-top: 10px; margin-bottom: 0;">
              <input id="customCommand" type="text" value="STATUS" style="width: 150px;">
              <button id="sendCustom">送信</button>
            </div>
          </details>
        </div>
      </div>
    </section>
  </main>

  <script>
    let port, writer, reader;

    const statusEl = document.querySelector("#status");
    const logEl = document.querySelector("#log");
    const speedEl = document.querySelector("#speed");
    const speedZEl = document.querySelector("#speedZ");

    const canvas = document.getElementById("radarCanvas");
    const ctx = canvas.getContext("2d");
    let currentArm1 = 0;
    let currentArm2 = 0;

    const STEPS_PER_REV_J1 = 1600; 
    const STEPS_PER_MM_J2 = 10;    

    function log(message) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent += `[${time}] ${message}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function sendCommand(command, hideLog = false) {
      if (!writer) {
        if (!hideLog) log(`[未接続] ${command}`);
        return false;
      }
      await writer.write(`${command}\n`);
      if (!hideLog) log(`> ${command}`);
      return true;
    }

    function drawRadar() {
      const width = canvas.width;
      const height = canvas.height;
      const centerX = width / 2;
      const centerY = height / 2;

      ctx.clearRect(0, 0, width, height);

      ctx.strokeStyle = "#2d3748";
      ctx.lineWidth = 1;
      for(let r = 30; r <= 120; r += 30) {
        ctx.beginPath();
        ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
        ctx.stroke();
      }
      
      ctx.beginPath();
      ctx.moveTo(centerX, 0); ctx.lineTo(centerX, height);
      ctx.moveTo(0, centerY); ctx.lineTo(width, centerY);
      ctx.stroke();

      const angleRad = (currentArm1 / STEPS_PER_REV_J1) * Math.PI * 2 - (Math.PI / 2);
      const radius = 30 + (currentArm2 / STEPS_PER_MM_J2); 

      const targetX = centerX + radius * Math.cos(angleRad);
      const targetY = centerY + radius * Math.sin(angleRad);

      ctx.strokeStyle = "#4da8da";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(targetX, targetY);
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(centerX, centerY, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#d92d20";
      ctx.beginPath();
      ctx.arc(targetX, targetY, 6, 0, Math.PI * 2);
      ctx.fill();
    }
    
    drawRadar();

    setInterval(() => {
      if (writer) {
        sendCommand("STATUS", true);
      }
    }, 500);
    
    async function readLoop() {
      const textDecoder = new TextDecoderStream();
      port.readable.pipeTo(textDecoder.writable).catch(() => {});
      reader = textDecoder.readable.getReader();
      let buffer = ""; 

      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          if (value) {
            buffer += value;
            let lines = buffer.split('\n');
            buffer = lines.pop();

            for (let line of lines) {
              line = line.trim();
              if (line.length === 0) continue;
              
              if (line.startsWith("POS")) {
                const match1 = line.match(/ARM1=(-?\d+)/);
                const match2 = line.match(/ARM2=(-?\d+)/);
                if (match1) currentArm1 = parseInt(match1[1]);
                if (match2) currentArm2 = parseInt(match2[1]);
                requestAnimationFrame(drawRadar);
              } else {
                log(line);
              }
            }
          }
        }
      } catch (error) {
        log(`受信が止まりました: ${error.message}`);
      }
    }

    document.querySelector("#connect").addEventListener("click", async () => {
      if (!("serial" in navigator)) {
        statusEl.textContent = "Web Serialあかんで";
        log("ChromeまたはEdgeであけろ");
        return;
      }

      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        const textEncoder = new TextEncoderStream();
        textEncoder.readable.pipeTo(port.writable).catch(() => {});
        writer = textEncoder.writable.getWriter();

        statusEl.textContent = "コネクト中";
        log("Arduinoに接続しました");
        readLoop();
      } catch (e) {
        log("接続がキャンセルされたか、エラーが発生した");
      }
    });

    document.querySelectorAll("[data-axis]").forEach((button) => {
      const start = (event) => {
        event.preventDefault();
        const axis = button.dataset.axis;
        const targetSpeedEl = (axis === "Z") ? speedZEl : speedEl;
        const speed = Math.max(50, Number(targetSpeedEl.value) || 50);
        
        const signedSpeed = speed * Number(button.dataset.dir);
        sendCommand(`DRIVE ${axis} ${signedSpeed}`);
      };
      
      const stop = (event) => {
        event.preventDefault();
        sendCommand(`DRIVE ${button.dataset.axis} 0`);
      };

      button.addEventListener("pointerdown", start);
      button.addEventListener("pointerup", stop);
      button.addEventListener("pointercancel", stop);
      button.addEventListener("pointerleave", stop);
      button.addEventListener("contextmenu", (e) => e.preventDefault()); 
    });

    document.querySelector("#stop").addEventListener("click", () => sendCommand("STOP"));
    
    document.querySelector("#home").addEventListener("click", () => {
      sendCommand("HOME");
      currentArm1 = 0;
      currentArm2 = 0;
      drawRadar();
    });

    document.querySelector("#zero").addEventListener("click", () => {
      if (confirm("現在のステッピングモーターの位置を新しい初期位置（原点）として記憶しますか？")) {
        sendCommand("ZERO");
        currentArm1 = 0;
        currentArm2 = 0;
        drawRadar();
        log("現在の位置を原点として設定しました");
      }
    });
    
    // 【追加】サーボの操作系イベント
    document.querySelector("#closeArm").addEventListener("click", () => sendCommand("ARM 0"));
    document.querySelector("#openArm").addEventListener("click", () => sendCommand("ARM 70"));
    
    document.querySelector("#servoMinus").addEventListener("click", () => sendCommand("SERVO_ADD -5"));
    document.querySelector("#servoPlus").addEventListener("click", () => sendCommand("SERVO_ADD 5"));
    document.querySelector("#servoZero").addEventListener("click", () => {
      if (confirm("現在のサーボ角度を『掴む（0度）』の基準に設定しますか？\n（設定後、『離す』ボタンはその基準から70度開いた場所になります）")) {
        sendCommand("SERVO_ZERO");
      }
    });
    
    document.querySelector("#sendCustom").addEventListener("click", () => {
      sendCommand(document.querySelector("#customCommand").value.trim());
    });

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      const key = e.key.toLowerCase();

      if (document.activeElement.tagName === "INPUT") return;

      const speedArm = Math.max(50, Number(speedEl.value) || 50);
      const speedZ = Math.max(50, Number(speedZEl.value) || 50); 

      if (key === 'a') sendCommand(`DRIVE J1 ${-speedArm}`);
      if (key === 'd') sendCommand(`DRIVE J1 ${speedArm}`);
      if (key === 'w') sendCommand(`DRIVE J2 ${speedArm}`);
      if (key === 's') sendCommand(`DRIVE J2 ${-speedArm}`);
      
      if (key === 'q') sendCommand(`DRIVE Z ${speedZ}`); 
      if (key === 'e') sendCommand(`DRIVE Z ${-speedZ}`);

      if (key === ' ') {
        e.preventDefault(); 
        sendCommand("ARM 0"); 
      }
      if (e.key === 'Shift') {
        sendCommand("ARM 70"); 
      }
    });

    window.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();

      if (key === 'a' || key === 'd') sendCommand(`DRIVE J1 0`);
      if (key === 'w' || key === 's') sendCommand(`DRIVE J2 0`);
      if (key === 'q' || key === 'e') sendCommand(`DRIVE Z 0`);
    });

    let gamepadIndex = null;
    let lastJ1Speed = 0, lastJ2Speed = 0, lastZSpeed = 0; 
    let lastBtnA = false, lastBtnB = false;

    window.addEventListener("gamepadconnected", (e) => {
      gamepadIndex = e.gamepad.index;
      log(`コントローラー接続: ${e.gamepad.id}`);
      pollGamepad();
    });

    window.addEventListener("gamepaddisconnected", (e) => {
      if (gamepadIndex === e.gamepad.index) gamepadIndex = null;
      log("コントローラーが切断されました");
    });

    function pollGamepad() {
      if (gamepadIndex === null) return;
      const pad = navigator.getGamepads()[gamepadIndex];
      if (pad) {
        const speedArm = Math.max(50, Number(speedEl.value) || 50);
        const speedZ = Math.max(50, Number(speedZEl.value) || 50); 
        const deadzone = 0.2;

        let j1Speed = Math.abs(pad.axes[0]) > deadzone ? Math.round(pad.axes[0] * speedArm) : 0;
        let j2Speed = Math.abs(pad.axes[1]) > deadzone ? Math.round(-pad.axes[1] * speedArm) : 0;
        let zSpeed = Math.abs(pad.axes[3]) > deadzone ? Math.round(-pad.axes[3] * speedZ) : 0;

        if (j1Speed !== lastJ1Speed) { sendCommand(`DRIVE J1 ${j1Speed}`); lastJ1Speed = j1Speed; }
        if (j2Speed !== lastJ2Speed) { sendCommand(`DRIVE J2 ${j2Speed}`); lastJ2Speed = j2Speed; }
        if (zSpeed !== lastZSpeed) { sendCommand(`DRIVE Z ${zSpeed}`); lastZSpeed = zSpeed; }

        const btnA = pad.buttons[0].pressed;
        const btnB = pad.buttons[1].pressed;
        if (btnA && !lastBtnA) sendCommand("ARM 0");
        if (btnB && !lastBtnB) sendCommand("ARM 70");
        lastBtnA = btnA;
        lastBtnB = btnB;
      }
      requestAnimationFrame(pollGamepad);
    }
  </script>
</body>
</html>
