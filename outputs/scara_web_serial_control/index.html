<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パキラロボ コントローラー</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #17202a;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    main {
      width: min(1120px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 20px 0 34px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 19px;
    }

    .status {
      min-width: 180px;
      padding: 10px 12px;
      border: 1px solid #cbd5df;
      border-radius: 8px;
      background: #ffffff;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    .toolbar,
    .panel {
      border: 1px solid #cbd5df;
      border-radius: 8px;
      background: #ffffff;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 12px;
      margin-bottom: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(300px, 390px);
      gap: 14px;
      align-items: start;
    }

    .panel {
      padding: 16px;
      margin-bottom: 14px;
    }

    button {
      min-height: 46px;
      border: 1px solid #a9b7c6;
      border-radius: 8px;
      background: #eef3f7;
      color: #17202a;
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
      padding: 0 16px;
      /* スマホ等の長押しでメニューや選択が出るのを防ぐ */
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    button:hover:not(:disabled) {
      background: #e1ebf3;
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.primary {
      border-color: #2364aa;
      background: #2364aa;
      color: #ffffff;
    }

    button.danger {
      border-color: #b42318;
      background: #b42318;
      color: #ffffff;
    }

    button.warn {
      border-color: #bb7a00;
      background: #fff2cc;
    }

    .manual { display: grid; gap: 10px; }
    .axis {
      display: grid;
      grid-template-columns: 86px 1fr 1fr;
      gap: 8px;
      align-items: center;
    }
    .axis-slider {
      display: grid;
      grid-template-columns: 86px 1fr 40px;
      gap: 8px;
      align-items: center;
    }
    label { font-weight: 750; }
    input[type="number"], input[type="text"] {
      width: 96px;
      min-height: 40px;
      box-sizing: border-box;
      border: 1px solid #a9b7c6;
      border-radius: 8px;
      padding: 0 10px;
      font-size: 16px;
    }
    input[type="range"] {
      width: 100%;
    }
    .field { display: flex; align-items: center; gap: 8px; }
    .magnet {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    details { margin-top: 8px; }
    summary { cursor: pointer; font-weight: 800; }
    pre {
      height: 150px;
      margin: 0;
      overflow: auto;
      padding: 12px;
      border-radius: 8px;
      background: #101820;
      color: #d7f2ff;
      font-size: 13px;
      white-space: pre-wrap;
    }

    /* 操作ガイド用のスタイル */
    .key-guide {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }
    .guide-item {
      display: flex;
      align-items: center;
      font-size: 15px;
      font-weight: bold;
      color: #2d3748;
    }
    .key-badge {
      display: inline-block;
      min-width: 20px;
      padding: 4px 8px;
      margin-right: 4px;
      background: #f8fafc;
      border: 1px solid #cbd5df;
      border-radius: 6px;
      font-family: ui-monospace, monospace;
      text-align: center;
      box-shadow: 0 3px 0 #cbd5df;
    }
    .guide-desc {
      margin-left: 8px;
      color: #4a5568;
    }

    @media (max-width: 820px) {
      header, .layout { grid-template-columns: 1fr; }
      .axis, .axis-slider { grid-template-columns: 76px 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>パキラロボ コントローラー</h1>
      <div class="status" id="status">未接続</div>
    </header>

    <section class="toolbar">
      <button class="primary" id="connect">Arduinoに接続</button>
      <button class="danger" id="stop">全停止</button>
      <button class="warn" id="home">初期位置へ戻る</button>
    </section>

    <section class="layout">
      <div>
        <div class="panel">
          <h2>クレーン手動操作</h2>
          <div class="manual">
            <div class="field">
              <label for="speed">移動速度</label>
              <input id="speed" type="number" value="450" min="50" max="1500" step="50">
            </div>
            <div class="axis">
              <label>肩 (旋回)</label>
              <button data-axis="J1" data-dir="-1">左回転</button>
              <button data-axis="J1" data-dir="1">右回転</button>
            </div>
            <div class="axis">
              <label>肘 (伸縮)</label>
              <button data-axis="J2" data-dir="-1">ちぢむ</button>
              <button data-axis="J2" data-dir="1">のびる</button>
            </div>
            <div class="axis-slider">
              <label>上下高さ</label>
              <input type="range" id="zSlider" min="0" max="180" value="90">
              <span id="zVal" style="font-weight: bold; text-align: center;">50%</span>
            </div>
          </div>
        </div>

        <div class="panel">
          <h2>アーム（サーボ）</h2>
          <div class="magnet">
            <button class="primary" id="closeArm">つかむ</button>
            <button id="openArm">はなす</button>
          </div>
        </div>
      </div>

      <div>
        <div class="panel">
          <h2>キーボード＆ゲームパッド操作</h2>
          <div class="key-guide">
            <div class="guide-item">
              <div>
                <span class="key-badge">W</span><span class="key-badge">A</span><span class="key-badge">S</span><span class="key-badge">D</span>
              </div>
              <span class="guide-desc">平面移動 / 左スティック</span>
            </div>
            <div class="guide-item">
              <div>
                <span class="key-badge">Q</span><span class="key-badge">E</span>
              </div>
              <span class="guide-desc">上下移動 / 右スティック上下</span>
            </div>
            <div class="guide-item">
              <div>
                <span class="key-badge">Space</span>
              </div>
              <span class="guide-desc">つかむ / Aボタン(×)</span>
            </div>
            <div class="guide-item">
              <div>
                <span class="key-badge">Shift</span>
              </div>
              <span class="guide-desc">はなす / Bボタン(〇)</span>
            </div>
          </div>
        </div>

        <div class="panel">
          <h2>通信ログ</h2>
          <pre id="log"></pre>
          <details>
            <summary>詳細コマンド</summary>
            <div class="toolbar" style="margin-top: 10px; margin-bottom: 0;">
              <input id="customCommand" type="text" value="STATUS" style="width: 150px;">
              <button id="sendCustom">送信</button>
            </div>
          </details>
        </div>
      </div>
    </section>
  </main>

  <script>
    let port, writer, reader;

    const statusEl = document.querySelector("#status");
    const logEl = document.querySelector("#log");
    const speedEl = document.querySelector("#speed");

    function log(message) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent += `[${time}] ${message}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function sendCommand(command) {
      if (!writer) {
        // log(`[未接続] ${command}`);
        return false;
      }
      await writer.write(`${command}\n`);
      log(`> ${command}`);
      return true;
    }

    // --- シリアル通信のロジック ---
    async function readLoop() {
      const textDecoder = new TextDecoderStream();
      port.readable.pipeTo(textDecoder.writable).catch(() => {});
      reader = textDecoder.readable.getReader();

      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          if (value) log(value.trim());
        }
      } catch (error) {
        log(`受信が止まりました: ${error.message}`);
      }
    }

    document.querySelector("#connect").addEventListener("click", async () => {
      if (!("serial" in navigator)) {
        statusEl.textContent = "Web Serial非対応";
        log("ChromeまたはEdgeで開いてください");
        return;
      }

      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        const textEncoder = new TextEncoderStream();
        textEncoder.readable.pipeTo(port.writable).catch(() => {});
        writer = textEncoder.writable.getWriter();

        statusEl.textContent = "接続中";
        log("Arduinoに接続しました");
        readLoop();
      } catch (e) {
        log("接続がキャンセルされたか、エラーが発生しました");
      }
    });

    // --- ステッピングモーター（J1, J2）の画面ボタン制御 ---
    document.querySelectorAll("[data-axis]").forEach((button) => {
      const start = (event) => {
        event.preventDefault();
        const speed = Math.max(50, Number(speedEl.value) || 50);
        const signedSpeed = speed * Number(button.dataset.dir);
        sendCommand(`DRIVE ${button.dataset.axis} ${signedSpeed}`);
      };
      
      const stop = (event) => {
        event.preventDefault();
        sendCommand(`DRIVE ${button.dataset.axis} 0`);
      };

      button.addEventListener("pointerdown", start);
      button.addEventListener("pointerup", stop);
      button.addEventListener("pointercancel", stop);
      button.addEventListener("pointerleave", stop);
    });

    // --- 各種ボタンイベント ---
    document.querySelector("#stop").addEventListener("click", () => sendCommand("STOP"));
    document.querySelector("#home").addEventListener("click", () => {
      sendCommand("HOME");
      document.querySelector("#zSlider").value = 90;
      document.querySelector("#zVal").textContent = "50%";
      currentZ = 90;
      lastZSent = 90;
    });
    
    document.querySelector("#closeArm").addEventListener("click", () => sendCommand("ARM 0"));
    document.querySelector("#openArm").addEventListener("click", () => sendCommand("ARM 90"));
    
    document.querySelector("#sendCustom").addEventListener("click", () => {
      sendCommand(document.querySelector("#customCommand").value.trim());
    });

    // --- Z軸サーボのスライダー制御 ---
    const zSlider = document.querySelector("#zSlider");
    const zVal = document.querySelector("#zVal");
    
    zSlider.addEventListener("input", (e) => {
      const percent = Math.round((e.target.value / 180) * 100);
      zVal.textContent = `${percent}%`;
    });
    
    zSlider.addEventListener("change", (e) => {
      sendCommand(`Z ${e.target.value}`);
      currentZ = parseInt(e.target.value);
      lastZSent = currentZ;
    });

    // ==========================================
    //  キーボード＆ゲームパッド操作ロジック
    // ==========================================
    const activeKeys = new Set();
    let currentZ = parseInt(zSlider.value) || 90;
    let lastZSent = currentZ;

    // --- キーボード処理 ---
    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      const key = e.key.toLowerCase();
      activeKeys.add(key);

      // コマンド入力欄にフォーカスがある時はキーボード操縦を無効化
      if (document.activeElement.tagName === "INPUT") return;

      const speed = Math.max(50, Number(speedEl.value) || 50);

      if (key === 'a') sendCommand(`DRIVE J1 ${-speed}`);
      if (key === 'd') sendCommand(`DRIVE J1 ${speed}`);
      if (key === 'w') sendCommand(`DRIVE J2 ${speed}`);
      if (key === 's') sendCommand(`DRIVE J2 ${-speed}`);

      if (key === ' ') {
        e.preventDefault(); 
        sendCommand("ARM 0"); 
      }
      if (e.key === 'Shift') {
        sendCommand("ARM 90"); 
      }
    });

    window.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      activeKeys.delete(key);

      if (key === 'a' || key === 'd') sendCommand(`DRIVE J1 0`);
      if (key === 'w' || key === 's') sendCommand(`DRIVE J2 0`);
    });

    // Z軸（サーボ）のキーボード長押しループ処理
    setInterval(() => {
      let zChanged = false;
      if (activeKeys.has('q')) {
        currentZ = Math.max(0, currentZ - 2);
        zChanged = true;
      }
      if (activeKeys.has('e')) {
        currentZ = Math.min(180, currentZ + 2);
        zChanged = true;
      }

      if (zChanged && Math.round(currentZ) !== lastZSent) {
        lastZSent = Math.round(currentZ);
        zSlider.value = lastZSent;
        zVal.textContent = `${Math.round((lastZSent / 180) * 100)}%`;
        sendCommand(`Z ${lastZSent}`);
      }
    }, 50);

    // --- ゲームパッド処理 ---
    let gamepadIndex = null;
    let lastJ1Speed = 0, lastJ2Speed = 0;
    let lastBtnA = false, lastBtnB = false;

    window.addEventListener("gamepadconnected", (e) => {
      gamepadIndex = e.gamepad.index;
      log(`🎮 コントローラー接続: ${e.gamepad.id}`);
      pollGamepad();
    });

    window.addEventListener("gamepaddisconnected", (e) => {
      if (gamepadIndex === e.gamepad.index) gamepadIndex = null;
      log("🎮 コントローラーが切断されました");
    });

    function pollGamepad() {
      if (gamepadIndex === null) return;
      const pad = navigator.getGamepads()[gamepadIndex];
      if (pad) {
        const speed = Math.max(50, Number(speedEl.value) || 50);
        const deadzone = 0.2;

        let j1Speed = Math.abs(pad.axes[0]) > deadzone ? Math.round(pad.axes[0] * speed) : 0;
        let j2Speed = Math.abs(pad.axes[1]) > deadzone ? Math.round(-pad.axes[1] * speed) : 0;

        if (j1Speed !== lastJ1Speed) { sendCommand(`DRIVE J1 ${j1Speed}`); lastJ1Speed = j1Speed; }
        if (j2Speed !== lastJ2Speed) { sendCommand(`DRIVE J2 ${j2Speed}`); lastJ2Speed = j2Speed; }

        let zAxis = pad.axes[3]; 
        if (Math.abs(zAxis) > deadzone) {
          currentZ = Math.max(0, Math.min(180, currentZ + zAxis * 3));
          if (Math.round(currentZ) !== lastZSent) {
            lastZSent = Math.round(currentZ);
            zSlider.value = lastZSent;
            zVal.textContent = `${Math.round((lastZSent / 180) * 100)}%`;
            sendCommand(`Z ${lastZSent}`);
          }
        }

        const btnA = pad.buttons[0].pressed;
        const btnB = pad.buttons[1].pressed;
        if (btnA && !lastBtnA) sendCommand("ARM 0");
        if (btnB && !lastBtnB) sendCommand("ARM 90");
        lastBtnA = btnA;
        lastBtnB = btnB;
      }
      requestAnimationFrame(pollGamepad);
    }
  </script>
</body>
</html>
