<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ピンポン玉ならべロボ</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #17202a;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    main {
      width: min(1120px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 20px 0 34px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 19px;
    }

    .status {
      min-width: 180px;
      padding: 10px 12px;
      border: 1px solid #cbd5df;
      border-radius: 8px;
      background: #ffffff;
      font-size: 14px;
      font-weight: 700;
    }

    .toolbar,
    .panel {
      border: 1px solid #cbd5df;
      border-radius: 8px;
      background: #ffffff;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 12px;
      margin-bottom: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(300px, 390px);
      gap: 14px;
      align-items: start;
    }

    .panel {
      padding: 16px;
      margin-bottom: 14px;
    }

    button {
      min-height: 46px;
      border: 1px solid #a9b7c6;
      border-radius: 8px;
      background: #eef3f7;
      color: #17202a;
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
    }

    button:hover {
      background: #e1ebf3;
    }

    button:active {
      transform: translateY(1px);
    }

    button.primary {
      border-color: #2364aa;
      background: #2364aa;
      color: #ffffff;
    }

    button.danger {
      border-color: #b42318;
      background: #b42318;
      color: #ffffff;
    }

    button.warn {
      border-color: #bb7a00;
      background: #fff2cc;
    }

    .turn {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 14px;
      border: 2px solid #2364aa;
      border-radius: 8px;
      background: #f0f7ff;
      margin-bottom: 14px;
      font-size: 22px;
      font-weight: 850;
    }

    .badge {
      min-width: 74px;
      padding: 8px 10px;
      border-radius: 8px;
      color: #ffffff;
      text-align: center;
      font-size: 18px;
    }

    .badge.red {
      background: #d92d20;
    }

    .badge.blue {
      background: #2563eb;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .cell {
      aspect-ratio: 1;
      min-height: 96px;
      display: grid;
      place-items: center;
      border: 2px solid #8fa3b8;
      background: #fbfcfd;
      font-size: 42px;
    }

    .cell.red {
      color: #d92d20;
      border-color: #d92d20;
      background: #fff1f0;
    }

    .cell.blue {
      color: #2563eb;
      border-color: #2563eb;
      background: #eff6ff;
    }

    .cell:disabled {
      cursor: not-allowed;
      opacity: 1;
    }

    .manual {
      display: grid;
      gap: 10px;
    }

    .axis {
      display: grid;
      grid-template-columns: 86px 1fr 1fr;
      gap: 8px;
      align-items: center;
    }

    label {
      font-weight: 750;
    }

    input {
      width: 96px;
      min-height: 40px;
      box-sizing: border-box;
      border: 1px solid #a9b7c6;
      border-radius: 8px;
      padding: 0 10px;
      font-size: 16px;
    }

    .field {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .magnet {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    details {
      margin-top: 8px;
    }

    summary {
      cursor: pointer;
      font-weight: 800;
    }

    pre {
      height: 150px;
      margin: 0;
      overflow: auto;
      padding: 12px;
      border-radius: 8px;
      background: #101820;
      color: #d7f2ff;
      font-size: 13px;
      white-space: pre-wrap;
    }

    @media (max-width: 820px) {
      header,
      .layout {
        grid-template-columns: 1fr;
      }

      .axis {
        grid-template-columns: 76px 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ピンポン玉ならべロボ</h1>
      <div class="status" id="status">まだつながっていません</div>
    </header>

    <section class="toolbar">
      <button class="primary" id="connect">ロボにつなぐ</button>
      <button class="danger" id="stop">ぜんぶ止める</button>
      <button class="warn" id="home">おうちにもどる</button>
      <button id="resetGame">ゲームをはじめから</button>
    </section>

    <section class="layout">
      <div>
        <div class="turn">
          <span id="turnText">赤のばんです</span>
          <span class="badge red" id="turnBadge">赤</span>
        </div>

        <div class="panel">
          <h2>入れたいマスをえらぶ</h2>
          <div class="board" id="board"></div>
        </div>

        <div class="panel">
          <h2>玉をつかむ・はなす</h2>
          <div class="magnet">
            <button class="primary" id="pickBall">玉をつかむ</button>
            <button id="dropBall">玉をはなす</button>
          </div>
        </div>
      </div>

      <div>
        <div class="panel">
          <h2>ちょっとだけ動かす</h2>
          <div class="manual">
            <div class="field">
              <label for="stepSize">うごく量</label>
              <input id="stepSize" type="number" value="200" min="1" max="10000" step="10">
            </div>
            <div class="axis">
              <label>うで1</label>
              <button data-axis="J1" data-dir="-1">左へ</button>
              <button data-axis="J1" data-dir="1">右へ</button>
            </div>
            <div class="axis">
              <label>うで2</label>
              <button data-axis="J2" data-dir="-1">左へ</button>
              <button data-axis="J2" data-dir="1">右へ</button>
            </div>
            <div class="axis">
              <label>上下</label>
              <button data-axis="Z" data-dir="-1">下へ</button>
              <button data-axis="Z" data-dir="1">上へ</button>
            </div>
          </div>
        </div>

        <div class="panel">
          <h2>ロボのようす</h2>
          <pre id="log"></pre>
          <details>
            <summary>先生用</summary>
            <div class="toolbar">
              <input id="customCommand" value="STATUS">
              <button id="sendCustom">送信</button>
            </div>
          </details>
        </div>
      </div>
    </section>
  </main>

  <script>
    let port;
    let writer;
    let reader;
    let currentPlayer = "red";
    const marks = Array(9).fill("");

    const statusEl = document.querySelector("#status");
    const logEl = document.querySelector("#log");
    const stepSizeEl = document.querySelector("#stepSize");
    const boardEl = document.querySelector("#board");
    const turnTextEl = document.querySelector("#turnText");
    const turnBadgeEl = document.querySelector("#turnBadge");

    const players = {
      red: { label: "赤", mark: "○", next: "blue", className: "red" },
      blue: { label: "青", mark: "×", next: "red", className: "blue" }
    };

    function log(message) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent += `[${time}] ${message}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function sendCommand(command) {
      if (!writer) {
        log("ロボとつながっていません");
        return false;
      }

      await writer.write(`${command}\n`);
      log(`> ${command}`);
      return true;
    }

    function updateTurn() {
      const player = players[currentPlayer];
      turnTextEl.textContent = `${player.label}のばんです`;
      turnBadgeEl.textContent = player.label;
      turnBadgeEl.className = `badge ${player.className}`;
    }

    function renderBoard() {
      boardEl.innerHTML = "";
      marks.forEach((mark, index) => {
        const button = document.createElement("button");
        button.className = "cell";
        button.textContent = mark || `${index + 1}`;
        button.disabled = Boolean(mark);
        if (mark === "○") button.classList.add("red");
        if (mark === "×") button.classList.add("blue");
        button.addEventListener("click", () => placeBall(index));
        boardEl.append(button);
      });
    }

    function winner() {
      const lines = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8],
        [0, 3, 6], [1, 4, 7], [2, 5, 8],
        [0, 4, 8], [2, 4, 6]
      ];
      for (const [a, b, c] of lines) {
        if (marks[a] && marks[a] === marks[b] && marks[a] === marks[c]) return marks[a];
      }
      return marks.every(Boolean) ? "draw" : "";
    }

    async function placeBall(index) {
      const player = players[currentPlayer];
      const ok = await sendCommand(`PLACE ${index + 1}`);
      if (!ok) return;

      marks[index] = player.mark;
      renderBoard();

      const result = winner();
      if (result === "○" || result === "×") {
        turnTextEl.textContent = `${player.label}のかちです`;
        log(`${player.label}のかちです`);
        return;
      }
      if (result === "draw") {
        turnTextEl.textContent = "ひきわけです";
        log("ひきわけです");
        return;
      }

      currentPlayer = player.next;
      updateTurn();
    }

    async function readLoop() {
      const textDecoder = new TextDecoderStream();
      port.readable.pipeTo(textDecoder.writable).catch(() => {});
      reader = textDecoder.readable.getReader();

      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          if (value) log(value.trim());
        }
      } catch (error) {
        log(`受信が止まりました: ${error.message}`);
      }
    }

    document.querySelector("#connect").addEventListener("click", async () => {
      if (!("serial" in navigator)) {
        statusEl.textContent = "このブラウザでは使えません";
        log("ChromeまたはEdgeで開いてください");
        return;
      }

      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 115200 });

      const textEncoder = new TextEncoderStream();
      textEncoder.readable.pipeTo(port.writable).catch(() => {});
      writer = textEncoder.writable.getWriter();

      statusEl.textContent = "ロボとつながっています";
      log("Arduino Mega 2560につながりました");
      readLoop();
    });

    document.querySelectorAll("[data-axis]").forEach((button) => {
      button.addEventListener("click", () => {
        const steps = Math.max(1, Number(stepSizeEl.value) || 1);
        const signedSteps = steps * Number(button.dataset.dir);
        sendCommand(`JOG ${button.dataset.axis} ${signedSteps}`);
      });
    });

    document.querySelector("#stop").addEventListener("click", () => sendCommand("STOP"));
    document.querySelector("#home").addEventListener("click", () => sendCommand("HOME"));
    document.querySelector("#pickBall").addEventListener("click", () => sendCommand("PICK"));
    document.querySelector("#dropBall").addEventListener("click", () => sendCommand("MAG 0"));
    document.querySelector("#resetGame").addEventListener("click", () => {
      marks.fill("");
      currentPlayer = "red";
      renderBoard();
      updateTurn();
      log("ゲームをはじめからにしました");
    });
    document.querySelector("#sendCustom").addEventListener("click", () => {
      sendCommand(document.querySelector("#customCommand").value.trim());
    });

    renderBoard();
    updateTurn();
  </script>
</body>
</html>
