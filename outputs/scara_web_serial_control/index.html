<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>クレーンロボ コントローラー</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #17202a;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    main {
      width: min(1120px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 20px 0 34px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 19px;
    }

    .status {
      min-width: 180px;
      padding: 10px 12px;
      border: 1px solid #cbd5df;
      border-radius: 8px;
      background: #ffffff;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    .toolbar,
    .panel {
      border: 1px solid #cbd5df;
      border-radius: 8px;
      background: #ffffff;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 12px;
      margin-bottom: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(300px, 390px);
      gap: 14px;
      align-items: start;
    }

    .panel {
      padding: 16px;
      margin-bottom: 14px;
    }

    button {
      min-height: 46px;
      border: 1px solid #a9b7c6;
      border-radius: 8px;
      background: #eef3f7;
      color: #17202a;
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
      padding: 0 16px;
    }

    button:hover {
      background: #e1ebf3;
    }

    button:active {
      transform: translateY(1px);
    }

    button.primary {
      border-color: #2364aa;
      background: #2364aa;
      color: #ffffff;
    }

    button.danger {
      border-color: #b42318;
      background: #b42318;
      color: #ffffff;
    }

    button.warn {
      border-color: #bb7a00;
      background: #fff2cc;
    }

    .turn {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
      padding: 14px;
      border: 2px solid #2364aa;
      border-radius: 8px;
      background: #f0f7ff;
      margin-bottom: 14px;
      font-size: 22px;
      font-weight: 850;
    }

    .badge {
      min-width: 74px;
      padding: 8px 10px;
      border-radius: 8px;
      color: #ffffff;
      text-align: center;
      font-size: 18px;
    }

    .badge.red { background: #d92d20; }
    .badge.blue { background: #2563eb; }

    /* チンチロ用スタイル */
    .chinchiro-area {
      display: grid;
      gap: 12px;
    }
    .dice-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
      font-weight: bold;
    }
    .dice-group {
      display: flex;
      gap: 6px;
    }
    .die {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 2px solid #8fa3b8;
      border-radius: 6px;
      background: #fbfcfd;
      font-size: 20px;
      font-weight: 900;
    }
    .die.red { color: #d92d20; border-color: #d92d20; background: #fff1f0;}
    .die.blue { color: #2563eb; border-color: #2563eb; background: #eff6ff;}
    .yaku-result {
      min-width: 100px;
      text-align: right;
      color: #4a5568;
    }
    .chinchiro-message {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      padding: 8px;
      background: #fff2cc;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .manual { display: grid; gap: 10px; }
    .axis {
      display: grid;
      grid-template-columns: 86px 1fr 1fr;
      gap: 8px;
      align-items: center;
    }
    label { font-weight: 750; }
    input {
      width: 96px;
      min-height: 40px;
      box-sizing: border-box;
      border: 1px solid #a9b7c6;
      border-radius: 8px;
      padding: 0 10px;
      font-size: 16px;
    }
    .field { display: flex; align-items: center; gap: 8px; }
    .magnet {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    details { margin-top: 8px; }
    summary { cursor: pointer; font-weight: 800; }
    pre {
      height: 150px;
      margin: 0;
      overflow: auto;
      padding: 12px;
      border-radius: 8px;
      background: #101820;
      color: #d7f2ff;
      font-size: 13px;
      white-space: pre-wrap;
    }

    @media (max-width: 820px) {
      header, .layout { grid-template-columns: 1fr; }
      .axis { grid-template-columns: 76px 1fr 1fr; }
      .turn { grid-template-columns: 1fr; text-align: center; justify-items: center;}
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>クレーンロボ コントローラー</h1>
      <div class="status" id="status">未接続</div>
    </header>

    <section class="toolbar">
      <button class="primary" id="connect">Arduinoに接続</button>
      <button class="danger" id="stop">全停止</button>
      <button class="warn" id="home">初期位置へ戻る</button>
    </section>

    <section class="layout">
      <div>
        <div class="turn">
          <span id="turnText">赤チームのターン</span>
          <span class="badge red" id="turnBadge">赤</span>
          <button id="nextTurnBtn">交代する</button>
        </div>

        <div class="panel">
          <h2>🎲 先攻決めチンチロ</h2>
          <div class="chinchiro-area">
            <div class="chinchiro-message" id="chinchiroMsg">ボタンを押して勝負！</div>
            
            <div class="dice-row">
              <span class="badge red">赤</span>
              <div class="dice-group" id="redDice">
                <div class="die red">-</div><div class="die red">-</div><div class="die red">-</div>
              </div>
              <div class="yaku-result" id="redYaku"></div>
            </div>

            <div class="dice-row">
              <span class="badge blue">青</span>
              <div class="dice-group" id="blueDice">
                <div class="die blue">-</div><div class="die blue">-</div><div class="die blue">-</div>
              </div>
              <div class="yaku-result" id="blueYaku"></div>
            </div>

            <button class="primary" id="rollDiceBtn" style="margin-top: 8px;">サイコロを振る</button>
          </div>
        </div>

        <div class="panel">
          <h2>🧲 電磁石</h2>
          <div class="magnet">
            <button class="primary" id="pickBall">吸着 ON</button>
            <button id="dropBall">吸着 OFF</button>
          </div>
        </div>
      </div>

      <div>
        <div class="panel">
          <h2>🕹️ クレーン手動操作</h2>
          <div class="manual">
            <div class="field">
              <label for="speed">移動速度</label>
              <input id="speed" type="number" value="450" min="50" max="1500" step="50">
            </div>
            <div class="axis">
              <label>肩 (旋回)</label>
              <button data-axis="J1" data-dir="-1">左回転</button>
              <button data-axis="J1" data-dir="1">右回転</button>
            </div>
            <div class="axis">
              <label>肘 (伸縮)</label>
              <button data-axis="J2" data-dir="-1">ちぢむ</button>
              <button data-axis="J2" data-dir="1">のびる</button>
            </div>
            <div class="axis">
              <label>上下</label>
              <button data-axis="Z" data-dir="-1">下降</button>
              <button data-axis="Z" data-dir="1">上昇</button>
            </div>
          </div>
        </div>

        <div class="panel">
          <h2>📝 通信ログ</h2>
          <pre id="log"></pre>
          <details>
            <summary>詳細コマンド</summary>
            <div class="toolbar" style="margin-top: 10px; margin-bottom: 0;">
              <input id="customCommand" value="STATUS" style="width: 150px;">
              <button id="sendCustom">送信</button>
            </div>
          </details>
        </div>
      </div>
    </section>
  </main>

  <script>
    let port, writer, reader;
    let currentPlayer = "red";

    const statusEl = document.querySelector("#status");
    const logEl = document.querySelector("#log");
    const speedEl = document.querySelector("#speed");
    const turnTextEl = document.querySelector("#turnText");
    const turnBadgeEl = document.querySelector("#turnBadge");

    const players = {
      red: { label: "赤", next: "blue", className: "red" },
      blue: { label: "青", next: "red", className: "blue" }
    };

    function log(message) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent += `[${time}] ${message}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function sendCommand(command) {
      if (!writer) {
        log("ロボとつながっていません");
        return false;
      }
      await writer.write(`${command}\n`);
      log(`> ${command}`);
      return true;
    }

    function updateTurn() {
      const player = players[currentPlayer];
      turnTextEl.textContent = `${player.label}チームのターン`;
      turnBadgeEl.textContent = player.label;
      turnBadgeEl.className = `badge ${player.className}`;
    }

    document.querySelector("#nextTurnBtn").addEventListener("click", () => {
      currentPlayer = players[currentPlayer].next;
      updateTurn();
    });

    // --- チンチロのロジック ---
    function rollDice() {
      return [
        Math.floor(Math.random() * 6) + 1,
        Math.floor(Math.random() * 6) + 1,
        Math.floor(Math.random() * 6) + 1
      ];
    }

    function evaluateChinchiro(dice) {
      const d = [...dice].sort();
      // アラシ・ピンゾロ
      if (d[0] === d[1] && d[1] === d[2]) {
        if (d[0] === 1) return { name: "ピンゾロ", score: 1000 };
        return { name: `${d[0]}のアラシ`, score: 100 + d[0] };
      }
      // シゴロ・ヒフミ
      if (d[0] === 4 && d[1] === 5 && d[2] === 6) return { name: "シゴロ", score: 90 };
      if (d[0] === 1 && d[1] === 2 && d[2] === 3) return { name: "ヒフミ", score: -10 };
      
      // 目
      if (d[0] === d[1]) return { name: `${d[2]}の目`, score: d[2] };
      if (d[1] === d[2]) return { name: `${d[0]}の目`, score: d[0] };
      
      // 目なし
      return { name: "目なし", score: 0 };
    }

    function renderDice(containerId, diceArray, colorClass) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      diceArray.forEach(val => {
        const die = document.createElement("div");
        die.className = `die ${colorClass}`;
        die.textContent = val;
        container.appendChild(die);
      });
    }

    document.querySelector("#rollDiceBtn").addEventListener("click", () => {
      const redRoll = rollDice();
      const blueRoll = rollDice();
      
      renderDice("redDice", redRoll, "red");
      renderDice("blueDice", blueRoll, "blue");

      const redResult = evaluateChinchiro(redRoll);
      const blueResult = evaluateChinchiro(blueRoll);

      document.getElementById("redYaku").textContent = redResult.name;
      document.getElementById("blueYaku").textContent = blueResult.name;

      const msgEl = document.getElementById("chinchiroMsg");
      if (redResult.score > blueResult.score) {
        msgEl.textContent = "赤チームの先攻！";
        currentPlayer = "red";
      } else if (blueResult.score > redResult.score) {
        msgEl.textContent = "青チームの先攻！";
        currentPlayer = "blue";
      } else {
        msgEl.textContent = "引き分け！もう一回！";
        return; // 引き分けの場合はターンを切り替えない
      }
      updateTurn();
    });

    // --- シリアル通信のロジック ---
    async function readLoop() {
      const textDecoder = new TextDecoderStream();
      port.readable.pipeTo(textDecoder.writable).catch(() => {});
      reader = textDecoder.readable.getReader();

      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          if (value) log(value.trim());
        }
      } catch (error) {
        log(`受信が止まりました: ${error.message}`);
      }
    }

    document.querySelector("#connect").addEventListener("click", async () => {
      if (!("serial" in navigator)) {
        statusEl.textContent = "Web Serial非対応";
        log("ChromeまたはEdgeで開いてください");
        return;
      }

      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 115200 });

      const textEncoder = new TextEncoderStream();
      textEncoder.readable.pipeTo(port.writable).catch(() => {});
      writer = textEncoder.writable.getWriter();

      statusEl.textContent = "接続中";
      log("Arduinoに接続しました");
      readLoop();
    });

    // --- モーター制御イベント ---
    document.querySelectorAll("[data-axis]").forEach((button) => {
      const start = (event) => {
        event.preventDefault();
        const speed = Math.max(50, Number(speedEl.value) || 50);
        const signedSpeed = speed * Number(button.dataset.dir);
        sendCommand(`DRIVE ${button.dataset.axis} ${signedSpeed}`);
      };
      const stop = (event) => {
        event.preventDefault();
        sendCommand(`DRIVE ${button.dataset.axis} 0`);
      };

      button.addEventListener("pointerdown", start);
      button.addEventListener("pointerup", stop);
      button.addEventListener("pointercancel", stop);
      button.addEventListener("pointerleave", stop);
    });

    document.querySelector("#stop").addEventListener("click", () => sendCommand("STOP"));
    document.querySelector("#home").addEventListener("click", () => sendCommand("HOME"));
    document.querySelector("#pickBall").addEventListener("click", () => sendCommand("MAG 1"));
    document.querySelector("#dropBall").addEventListener("click", () => sendCommand("MAG 0"));
    document.querySelector("#sendCustom").addEventListener("click", () => {
      sendCommand(document.querySelector("#customCommand").value.trim());
    });

    // 初期化
    updateTurn();
  </script>
</body>
</html>
